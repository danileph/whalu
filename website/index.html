<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Run before the browser restores scroll or resolves a section anchor.
      const reloading =
        performance.getEntriesByType("navigation")[0]?.type === "reload";
      history.scrollRestoration = reloading ? "manual" : "auto";
      if (reloading && location.hash) {
        const url = new URL(location.href);
        url.hash = "";
        history.replaceState(history.state, "", url);
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="Switch between windows on your Mac with trackpad gestures, a mouse, or keyboard shortcuts. Free and open source. For macOS 15 and later."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Whalu — Switch windows with a swipe" />
    <meta
      property="og:description"
      content="Navigate windows, change their order, and tile them with macOS shortcuts. Whalu is free and open source."
    />
    <link rel="icon" type="image/png" href="./whalu-icon.png" />
    <title>Whalu — Switch windows with a swipe</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript
      >Whalu switches and arranges windows on your Mac. Free and open source.
      Enable JavaScript to watch the demo and read the installation guide.</noscript
    >
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
